name: NittoReportLite
options:
  bundleIdPrefix: com.nitto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  NittoReportLite:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NittoReportLite
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 報告書
        UILaunchScreen: {}
        NSCameraUsageDescription: "作業写真を撮影するためにカメラを使用します"
        NSPhotoLibraryUsageDescription: "作業写真を選択するために写真ライブラリを使用します"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nitto.reportlite
        PRODUCT_NAME: NittoReportLite
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
